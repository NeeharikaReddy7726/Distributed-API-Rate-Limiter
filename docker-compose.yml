services:

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server1:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  server2:
    build: .
    ports:
      - "8001:8000"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  server3:
    build: .
    ports:
      - "8002:8000"
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy